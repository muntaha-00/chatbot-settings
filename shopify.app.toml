client_id = "367992dee8c368b2e89b53b54a4c5b1b"
name = "chatbot-settings"
application_url = "https://example.com"
embedded = true

[build]
automatically_update_urls_on_dev = true

# ===================================
# APP PROXY CONFIGURATION
# This allows storefront to access your API routes
# ===================================
[app_proxy]
url = "/api/proxy"
subpath = "chatbot"
prefix = "apps"

# This creates the URL pattern:
# https://YOUR_STORE.myshopify.com/apps/chatbot/api/settings
# Which proxies to: your-app-url/api/proxy/api/settings
# ===================================

[webhooks]
api_version = "2026-01"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_products,write_products,read_orders,write_orders,read_customers,write_customers,read_metaobjects,write_metaobjects,read_script_tags,write_script_tags"

[auth]
redirect_urls = [ "https://example.com/api/auth" ]