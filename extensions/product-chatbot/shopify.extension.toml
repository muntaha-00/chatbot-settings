# shopify.extension.toml
name = "Product Chatbot"

uid = "ce317f14-cff3-49c8-23a9-c805e96f49e1de6dce8b"

type = "theme_app_extension"
handle = "product-chatbot"

[capabilities]
# Allows dynamic block rendering and progress tracking
block_progress = true

# === Optional: if you plan to let merchants configure chat behavior ===
[[metafields]]
namespace = "product_chatbot"
key = "settings"
type = "json"
description = "Stores chatbot configuration such as tone, API key, and default messages."

# === Optional future-proofing ===
[[metafields]]
namespace = "product_chatbot"
key = "conversation_history"
type = "json"
description = "Stores per-product chat history for each customer."
